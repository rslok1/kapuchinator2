name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libreadline-dev libsqlite3-dev libgdbm-dev \
            libssl-dev libffi-dev liblzma-dev build-essential

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept licenses, install components and symlink SDK for Buildozer
        run: |
          # 1. Принимаем ВСЕ лицензии в системном SDK
          yes | sdkmanager --licenses || true

          # 2. Устанавливаем компоненты
          sdkmanager "build-tools;33.0.2" "build-tools;37.0.0" "platforms;android-33" "ndk;25.2.9519653"

          # 3. Симлинк: системный SDK → путь, который ожидает Buildozer
          mkdir -p /home/runner/.buildozer/android/platform/
          ln -sf "$ANDROID_HOME" /home/runner/.buildozer/android/platform/android-sdk

          # 4. Проверяем, что aidl доступен
          echo "=== Checking aidl ==="
          ls -la "$ANDROID_HOME/build-tools/33.0.2/aidl" || echo "aidl 33.0.2 not found"
          ls -la "$ANDROID_HOME/build-tools/37.0.0/aidl" || echo "aidl 37.0.0 not found"

      - name: Install Python dependencies and Buildozer
        run: |
          pip install --upgrade pip setuptools wheel
          pip install git+https://github.com/kivy/buildozer.git
          pip install "cython<3.0" virtualenv

      - name: Build APK with Buildozer
        run: echo y | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Capuchinator-APK
          path: bin/*.apk
